<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Animate Occupancy Bar
        setTimeout(() => {
            const bar = document.getElementById('occupancy-bar');
            if (bar) bar.style.width = bar.getAttribute('data-target');
        }, 300);

        // Animate Chart Bars
        setTimeout(() => {
            const bars = document.querySelectorAll('.chart-bar');
            bars.forEach((bar, index) => {
                setTimeout(() => {
                    bar.style.height = bar.getAttribute('data-height');
                }, index * 100);
            });
        }, 500);

        // Fake Countdown Timer logic (counting down to 10:00 AM next day for demo purposes)
        const display = document.getElementById('countdown-display');
        
        function updateTimer() {
            const now = new Date();
            let target = new Date();
            target.setHours(10, 0, 0, 0);
            
            if (now > target) {
                target.setDate(target.getDate() + 1); // Set for tomorrow if 10 AM passed
            }
            
            const diff = target - now;
            
            if (diff <= 0) {
                display.textContent = "00:00:00";
                return;
            }
            
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            
            display.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        
        updateTimer();
        setInterval(updateTimer, 1000);
    });
